[workspace.package]
description = "A Tool Box"
authors = ["Denis Tsai <denistsai@aetheras.io"]
version = "2.1.0"
edition = "2024"
repository = "https://github.com/aetheras-io/atb-rs"
homepage = "https://github.com/aetheras-io/atb-rs"
readme = "README.md"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace]
members = [
  "types",
  "ext/tokio",
  "ext/serde",
  "ext/graphql",
  "ext/graphql/derive",
  "utils/build",
  "utils/cli",
  "utils/fixtures",
  "utils/ai",
  "utils/logging",
]

[workspace.dependencies]
log = "0.4"
env_logger = "0.11"
ansi_term = "0.12"
tracing-appender = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "json",
  "parking_lot",
] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
uuid = { version = "1", features = ["serde", "v1", "v4", "v5", "v6", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"

# We will generally lock on MINOR versions to allow for some patch wiggle room at the library 
# importer, in case some small bug fix happens in the patches
[package]
name = "atb"
description.workspace = true
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
atb-fixtures-utils = { path = "./utils/fixtures", version = "2.1.0", optional = true }
atb-logging = { path = "./utils/logging", version = "2.1.0" }

log = { workspace = true }
env_logger = { workspace = true }
ansi_term = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
once_cell = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }

# Eventsourcing
lucidstream = { version = "2.1", optional = true }
lucidstream-pg = { version = "2.1", optional = true }

# Nothing by default
[features]
default = []
all = ["eventsourcing", "fixtures"]
eventsourcing = ["lucidstream", "lucidstream-pg"]
fixtures = ["atb-fixtures-utils/jwt"]
